databases:
  - name: wellsync-db
    databaseName: wellsync
    user: wellsync
    plan: free

services:
  # ----------------------------------------------------------------------------
  # WellSync FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: wellsync-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python ml/train_dyno_classifier.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wellsync-db
          property: connectionString
      - key: JWT_SECRET
        generateCryptoKey: true
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: SIMULATOR_TICK_SECONDS
        value: "10"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ----------------------------------------------------------------------------
  # WellSync React Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: static
    name: wellsync-frontend
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://wellsync-backend.onrender.com/api/v1
