services:
  # ----------------------------------------------------------------------------
  # WellSync React Frontend (Static Site) — Branch Preview
  # ----------------------------------------------------------------------------
  - type: web
    name: wellsync-branch
    runtime: static
    rootDir: frontend
    branch: feature/frontend-improvements
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://wellsync-backend-m8a8.onrender.com/api/v1

  # ----------------------------------------------------------------------------
  # WellSync FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: wellsync-backend
    runtime: python
    region: singapore
    rootDir: backend
    branch: feature/frontend-improvements
    plan: free
    buildCommand: "pip install -r requirements.txt && python ml/train_dyno_classifier.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.iodkvsaqquryaarfjttz:HelloSupabase31@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: SIMULATOR_TICK_SECONDS
        value: "10"
      - key: PYTHON_VERSION
        value: "3.11.9"

