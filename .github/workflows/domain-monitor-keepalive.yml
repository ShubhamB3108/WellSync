name: Domain Monitor & Render Keep-Alive

on:
  schedule:
    # Run every 10 minutes (Render free tier spins down after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keepalive:
    name: Ping WellSync Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Probe (domain-monitor compatible)
        run: |
          echo "Sending keepalive probe to WellSync backend on Render..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://wellsync-backend.onrender.com/health")
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
            echo "SUCCESS: Render backend is online. Idle timer reset."
          else
            echo "WARNING: Backend returned status $STATUS (or cold start in progress)."
            # Retry after 15 seconds in case of Render cold-start spin-up
            sleep 15
            RETRY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "https://wellsync-backend.onrender.com/health")
            echo "Retry HTTP Status: $RETRY_STATUS"
          fi
